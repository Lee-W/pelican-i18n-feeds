[project]
name = "pelican-i18n-feeds"
version = "0.2.0"
description = "Pelican plugin that writes Atom feeds listing the articles of every i18n_subsites language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wei Lee", email = "weilee.rx@gmail.com" }]
keywords = ["pelican", "plugin", "feed", "atom", "i18n", "i18n_subsites"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Framework :: Pelican :: Plugins",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["pelican>=4.7", "pelican-i18n-subsites>=0.9.0"]

[project.urls]
Homepage = "https://github.com/Lee-W/pelican-i18n-feeds"

[dependency-groups]
dev = [
  { include-group = "base" },
  { include-group = "test" },
  { include-group = "linters" },
]

base = ["poethepoet>=0.41.0"]

test = ["pytest>=9", "pytest-cov>=4", "pytest-xdist>=3.1.0", "markdown>=3.4"]

linters = ["ruff>=0.15.1", "mypy>=1.19.1", "prek>=0.3.3", "commitizen>=4.13.9"]


[build-system]
requires = ["uv_build >= 0.11.25, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pelican.plugins.i18n_feeds"
module-root = "src"

[tool.mypy]
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pelican.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "B", "RUF"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,*.lock'
check-hidden = true

[tool.poe.tasks]
format.help = "Format the code"
format.sequence = [{ cmd = "ruff check --fix" }, { cmd = "ruff format" }]

lint.help = "Lint the code"
lint.sequence = [{ cmd = "ruff check" }, { cmd = "mypy" }]

check-commit.help = "Check the commit messages"
check-commit.cmd = "cz --no-raise 3 check --rev-range origin/main.."

test.help = "Run the test suite"
test.cmd = "pytest -n auto --dist=loadfile"

cover.help = "Run the test suite with coverage"
cover.ref = "test --cov-report term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml -o junit_family=legacy"

all.help = "Run all tasks"
all.sequence = ["format", "lint", "check-commit", "cover"]

ci.help = "Run all tasks in CI"
ci.sequence = ["check-commit", { cmd = "prek run --all-files" }, "cover"]
ci.env = { SKIP = "no-commit-to-branch" }

setup-pre-commit.help = "Install pre-commit hooks"
setup-pre-commit.cmd = "prek install"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--cov=pelican.plugins.i18n_feeds", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["pelican/plugins/i18n_feeds"]

[tool.coverage.paths]
source = ["src/pelican/plugins/i18n_feeds", "*/pelican/plugins/i18n_feeds"]
